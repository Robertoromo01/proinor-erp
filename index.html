<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f4f5f7;--sidebar:#1a1d23;--sidebar-hover:#2a2d35;--accent:#3b82f6;--accent-dark:#2563eb;--white:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08);}
body{font-family:Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);display:flex;min-height:100vh;}
#sidebar{width:220px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;min-height:100vh;}
#sidebar .logo{padding:16px;border-bottom:1px solid #2a2d35;text-align:center;}
#sidebar .logo h2{color:#fff;font-size:15px;font-weight:700;}
#sidebar .logo p{color:#9ca3af;font-size:11px;margin-top:2px;}
#sidebar-logo-img{max-width:160px;max-height:80px;object-fit:contain;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;}
#sidebar nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-section{padding:8px 16px 4px;font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:#d1d5db;cursor:pointer;font-size:13px;transition:background .15s;}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item .icon{font-size:16px;width:20px;text-align:center;}
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
#topbar h1{font-size:18px;font-weight:700;}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 12px;border-radius:20px;font-size:13px;}
#content{flex:1;padding:24px;overflow-y:auto;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--white);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);border:1px solid var(--border);}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
.stat-card .value{font-size:24px;font-weight:700;}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:4px;}
.stat-card .sub-row{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;}
.panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:20px;}
.panel-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.panel-header h3{font-size:15px;font-weight:700;}
.panel-body{padding:20px;}
.tbl-wrap{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th{background:#f9fafb;padding:10px 12px;text-align:left;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
table.data td{padding:10px 12px;border-bottom:1px solid #f3f4f6;vertical-align:middle;}
table.data tr:hover td{background:#fafafa;}
table.data tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;}
.badge-green{background:#d1fae5;color:#065f46;}
.badge-blue{background:#dbeafe;color:#1e40af;}
.badge-yellow{background:#fef3c7;color:#92400e;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-gray{background:#f3f4f6;color:#374151;}
.badge-purple{background:#ede9fe;color:#5b21b6;}
.badge-orange{background:#ffedd5;color:#9a3412;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-secondary{background:#f3f4f6;color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:#e5e7eb;}
.btn-danger{background:#fee2e2;color:#991b1b;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{padding:6px;border-radius:6px;background:#f3f4f6;border:1px solid var(--border);cursor:pointer;font-size:14px;}
.btn-icon:hover{background:#e5e7eb;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.form-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:12px;color:var(--muted);font-weight:600;}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);background:#fff;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:2px solid var(--accent);border-color:transparent;}
.form-group textarea{resize:vertical;min-height:70px;}
.form-section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border-radius:12px;width:90%;max-width:820px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:16px;font-weight:700;}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.search-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.search-bar input{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;}
.pipeline{display:grid;gap:12px;}
.pipeline-col{background:#f9fafb;border-radius:var(--radius);padding:12px;}
.pipeline-col h4{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.pipeline-card{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.pipeline-card:hover{border-color:var(--accent);}
.pipeline-card .pname{font-weight:600;font-size:13px;}
.pipeline-card .pco{font-size:12px;color:var(--muted);}
.pipeline-card .pval{font-size:12px;color:var(--accent);margin-top:4px;font-weight:600;}
.ingreso-row td:first-child{border-left:3px solid var(--success);}
.egreso-row td:first-child{border-left:3px solid var(--danger);}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:10px 20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty .icon{font-size:40px;margin-bottom:12px;}
#toast{position:fixed;bottom:24px;right:24px;background:#1a1d23;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
#toast.show{opacity:1;}
.stock-alert{color:var(--danger);font-weight:700;}
.stock-ok{color:var(--success);}
.cot-items-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:13px;}
.cot-items-table th{background:#f9fafb;padding:7px 8px;font-size:11px;text-align:left;border-bottom:1px solid var(--border);}
.cot-items-table td{padding:5px 6px;border-bottom:1px solid #f3f4f6;}
.cot-totals{display:flex;justify-content:flex-end;}
.cot-tbox{width:260px;}
.cot-trow{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid #f3f4f6;}
.cot-trow.grand{font-weight:700;font-size:15px;border:none;border-top:2px solid #222;margin-top:4px;padding-top:8px;}
.cot-letra{font-size:11px;font-style:italic;color:var(--muted);margin-top:6px;padding:5px 8px;background:#f8f8f8;border-left:3px solid #ccc;border-radius:3px;}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px;}
.check-item{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;}
.check-item input[type=checkbox]{width:auto;}
.file-upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:border-color .2s;}
.file-upload-area:hover{border-color:var(--accent);}
.file-upload-area.has-file{border-color:var(--success);background:#f0fdf4;}
.file-info{display:flex;align-items:center;gap:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:8px 12px;font-size:13px;margin-top:8px;}
.img-preview{width:50px;height:50px;object-fit:contain;border:1px solid var(--border);border-radius:6px;background:#f9fafb;}
.btn-excel{background:#217346;color:#fff;border:none;}
.btn-excel:hover{background:#1a5c38;}
.kpi-section{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:20px;margin-bottom:20px;}
.kpi-section h3{font-size:14px;font-weight:700;margin-bottom:16px;color:var(--text);}
.chart-container{position:relative;height:220px;margin-top:12px;}
.admin-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.admin-tab{padding:10px 20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;}
.admin-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px;}
.perm-item{display:flex;align-items:center;gap:6px;font-size:12px;}
.log-row td{font-size:12px;}
@media(max-width:768px){#sidebar{width:60px;}.nav-item span,.nav-section,.logo p,.logo h2{display:none;}.nav-item{justify-content:center;}}
</style>
</head>

const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15dm9lZWxjYm5taGlqcnhldmp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDQ4OTQsImV4cCI6MjA5Nzk4MDg5NH0.gDA9tc7LQ5bfhdZAWXG-B4wGWfDewMvW7YPlTMdNZcI';

function fmt(n){return '$'+(parseFloat(n)||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fmtDate(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});}
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.style.background=ok?'#065f46':'#991b1b';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function openModal(title,body,footer){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-footer').innerHTML=footer;document.getElementById('modal').classList.add('open');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function badgeEstatus(e){const m={'activo':'green','ganado':'green','confirmado':'green','entregada':'green','aprobada':'green','contacto':'blue','en proceso':'blue','enviada':'blue','nuevo':'gray','borrador':'gray','inactivo':'gray','propuesta':'yellow','pendiente':'yellow','pendiente de pago':'yellow','negociacion':'purple','perdido':'red','rechazada':'red','cancelada':'red','eliminado':'orange','ingreso':'green','egreso':'red'};return `<span class="badge badge-${m[e?.toLowerCase()]||'gray'}">${e||'—'}</span>`;}
function showPage(page){document.querySelectorAll('.nav-item').forEach(n=>{n.classList.remove('active');if(n.getAttribute('onclick')?.includes(`'${page}'`))n.classList.add('active');});const titles={dashboard:'Dashboard',clientes:'Clientes',prospectos:'Prospectos',cotizaciones:'Cotizaciones',ordenes:'Órdenes de compra',proveedores:'Proveedores',ordenes_proveedor:'OC a Proveedores',catalogo:'Catálogo de Productos',inventario:'Inventario',contabilidad:'Contabilidad',vendedores:'Vendedores',administrador:'Administrador'};document.getElementById('page-title').textContent=titles[page]||page;pages[page]();}
function adminGuard(cb){if(_adminAuth){cb();return;}openModal('🔐 Administrador',`<div class="form-group" style="margin-bottom:12px;"><label>Contraseña</label><input type="password" id="ag-pass" onkeydown="if(event.key==='Enter')checkAG()" autofocus /></div><div id="ag-err" style="color:var(--danger);font-size:12px;display:none;">Contraseña incorrecta</div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="checkAG()">Entrar</button>`);window._agCb=cb;}
function checkAG(){const v=document.getElementById('ag-pass')?.value;if(v===ADMIN_PASS){_adminAuth=true;closeModal();if(window._agCb)window._agCb();}else{document.getElementById('ag-err').style.display='block';document.getElementById('ag-pass').value='';}}

const U=['','un','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve'];
const D=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function cent(n){if(n===100)return 'cien';if(!n)return '';const c=Math.floor(n/100),d=Math.floor((n%100)/10),u=n%10;let s=C[c]?(C[c]+' '):'';const du=d*10+u;if(du<20)s+=U[du];else if(!u)s+=D[d];else s+=D[d]+' y '+U[u];return s.trim();}
function miles(n){if(!n)return '';const m=Math.floor(n/1000),r=n%1000;let s=m===1?'mil':m>0?cent(m)+' mil':'';if(r>0)s+=(s?' ':'')+cent(r);return s.trim();}
function millones(n){if(!n)return 'cero';const mm=Math.floor(n/1000000),r=n%1000000;let s=mm===1?'un millón':mm>0?cent(mm)+' millones':'';if(r>0)s+=(s?' ':'')+miles(r);return s.trim()||'cero';}
function numLetra(t,cur='MXN'){const names={MXN:['peso','pesos','M.N.'],USD:['dólar','dólares','USD'],EUR:['euro','euros','EUR']};const nm=names[cur]||names.MXN;const e=Math.floor(t),cc=Math.round((t-e)*100);const l=millones(e);return 'Son: '+l.charAt(0).toUpperCase()+l.slice(1)+' '+(e===1?nm[0]:nm[1])+' '+String(cc).padStart(2,'0')+'/100 '+nm[2];}
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});}

const pages={};

// ===================== DASHBOARD V2 =====================
pages.dashboard=async function(){
  const c=document.getElementById('content');
  c.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted);">Cargando dashboard...</div>`;
  const[cls,pros,cots,ords,cont,inv]=await Promise.all([
    sb.from('clientes').select('id,estatus'),
    sb.from('prospectos').select('id,etapa,valor_estimado,estatus'),
    sb.from('cotizaciones').select('id,estatus,total,vendedor,fecha,cliente_nombre,items'),
    sb.from('ordenes').select('id,estatus,total'),
    sb.from('contabilidad').select('tipo,monto,estatus,fecha'),
    sb.from('inventario').select('id,nombre,sku,stock_actual,stock_minimo')
  ]);
  const allCli=cls.data||[];
  const totalCli=allCli.length,cliAct=allCli.filter(x=>x.estatus==='activo').length,cliInact=allCli.filter(x=>x.estatus==='inactivo').length;
  const allPros=pros.data||[];
  const prosAct=allPros.filter(p=>p.estatus!=='eliminado');
  const prosElim=allPros.filter(p=>p.estatus==='eliminado').length;
  const pipVal=prosAct.reduce((s,p)=>s+(parseFloat(p.valor_estimado)||0),0);
  const prosGan=prosAct.filter(p=>p.etapa==='ganado').length;
  const tasaConv=prosAct.length>0?Math.round(prosGan/prosAct.length*100):0;
  const allCots=cots.data||[];
  const cotAprobadas=allCots.filter(x=>x.estatus==='aprobada');
  const cotAprob=cotAprobadas.reduce((s,x)=>s+(parseFloat(x.total)||0),0);
  const ticketProm=cotAprobadas.length>0?cotAprob/cotAprobadas.length:0;
  const cotPorEst={borrador:allCots.filter(x=>x.estatus==='borrador').length,enviada:allCots.filter(x=>x.estatus==='enviada').length,aprobada:cotAprobadas.length,rechazada:allCots.filter(x=>x.estatus==='rechazada').length};
  const ordPend=(ords.data||[]).filter(x=>x.estatus==='pendiente').length;
  const allCont=cont.data||[];

  // Embudo conversión
  const etapas=['nuevo','contacto','propuesta','negociacion','ganado'];
  const embudo=etapas.map(e=>({e,n:prosAct.filter(p=>p.etapa===e).length}));

    <h2 style="font-size:16px;font-weight:700;color:var(--muted);">Resumen general</h2>

    <div class="stat-card"><div class="label">Prospectos activos</div><div class="value" style="color:var(--warning)">${prosAct.length}</div><div class="sub-row"><span style="font-size:12px;">Pipeline: ${fmt(pipVal)}</span></div></div>
    <div class="stat-card"><div class="label">Tasa de conversión</div><div class="value" style="color:var(--success)">${tasaConv}%</div><div class="sub">${prosGan} ganados de ${prosAct.length}</div></div>
    <div class="stat-card"><div class="label">Ticket promedio</div><div class="value" style="color:var(--accent)">${fmt(ticketProm)}</div><div class="sub">Cotizaciones aprobadas</div></div>
    <div class="stat-card"><div class="label">Ventas aprobadas</div><div class="value" style="color:var(--success)">${fmt(cotAprob)}</div><div class="sub">${cotAprobadas.length} cotizaciones</div></div>
    <div class="stat-card"><div class="label">Órdenes pendientes</div><div class="value" style="color:var(--danger)">${ordPend}</div><div class="sub">Por procesar</div></div>
    <div class="stat-card"><div class="label">Ingresos totales</div><div class="value" style="color:var(--success)">${fmt(ingresos)}</div><div class="sub">Registrados</div></div>
    <div class="stat-card"><div class="label">Balance</div><div class="value" style="color:${ingresos-egresos>=0?'var(--success)':'var(--danger)'}">${fmt(ingresos-egresos)}</div><div class="sub">Ingresos − Egresos</div></div>
    <div class="stat-card"><div class="label">Cuentas por cobrar</div><div class="value" style="color:var(--warning)">${fmt(cxc)}</div><div class="sub">Pendientes de pago</div></div>
    <div class="stat-card"><div class="label">Alertas inventario</div><div class="value" style="color:${invBajo>0?'var(--danger)':'var(--success)'}">${invBajo}</div><div class="sub">Bajo stock mínimo</div></div>
  </div>

  <!-- Comparativo mes -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px;">
    <div class="stat-card" style="border-left:4px solid var(--accent);">
      <div class="label">Ventas mes actual (${meses[5].label})</div>
      <div class="value" style="color:var(--accent)">${fmt(venActual)}</div>
    </div>
    <div class="stat-card" style="border-left:4px solid var(--muted);">
      <div class="label">Ventas mes anterior (${meses[4].label})</div>
      <div class="value" style="color:var(--muted)">${fmt(venAnterior)}</div>
    </div>
    <div class="stat-card" style="border-left:4px solid ${varPct>=0?'var(--success)':'var(--danger)'};">
      <div class="label">Variación</div>
      <div class="value" style="color:${varPct>=0?'var(--success)':'var(--danger)'}">${varPct>=0?'+':''}${varPct}%</div>
      <div class="sub">${varPct>=0?'↑ Crecimiento':'↓ Decremento'}</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
    <!-- Ventas por mes chart -->
    <div class="kpi-section">
      <h3>📈 Ventas por mes (últimos 6 meses)</h3>
      <div class="chart-container"><canvas id="chart-meses"></canvas></div>
    </div>
    <!-- Ventas por vendedor -->
    <div class="kpi-section">
      <h3>👤 Ventas por vendedor</h3>
      ${topVends.length?`<div class="chart-container"><canvas id="chart-vends"></canvas></div>`:`<div class="empty" style="padding:20px;">Sin datos de vendedores</div>`}
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
    <!-- Embudo conversión -->
    <div class="kpi-section">
      <h3>🎯 Embudo de conversión</h3>
      <table class="data">
        <thead><tr><th>Etapa</th><th>Prospectos</th><th>%</th></tr></thead>
        <tbody>${embudo.map(({e,n})=>`<tr><td>${badgeEstatus(e)}</td><td><strong>${n}</strong></td><td>${prosAct.length>0?Math.round(n/prosAct.length*100):0}%</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <!-- Productos más cotizados -->
    <div class="kpi-section">
      <h3>📦 Productos más cotizados</h3>
      ${topProds.length?`<table class="data"><thead><tr><th>#</th><th>Producto</th><th>Veces cotizado</th></tr></thead><tbody>${topProds.map(([p,n],i)=>`<tr><td><strong>${i+1}</strong></td><td>${esc(p.substring(0,40))}</td><td><span class="badge badge-blue">${n}</span></td></tr>`).join('')}</tbody></table>`:`<div class="empty" style="padding:20px;">Sin datos</div>`}
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
    <!-- Cotizaciones por estatus -->
    <div class="kpi-section">
      <h3>📄 Cotizaciones por estatus</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${Object.entries(cotPorEst).map(([k,v])=>`<div style="background:#f9fafb;padding:12px;border-radius:8px;text-align:center;"><div style="font-size:22px;font-weight:700;">${v}</div><div style="font-size:12px;color:var(--muted);">${k}</div></div>`).join('')}</div>
    </div>
    <!-- Inventario alertas -->
    <div class="kpi-section">
      <h3>⚠️ Inventario bajo stock</h3>
      <div id="dash-inv-kpi">Cargando...</div>
    </div>

  // Render charts
  setTimeout(()=>{
    // Chart ventas por mes
    const ctxM=document.getElementById('chart-meses');
    if(ctxM)new Chart(ctxM,{type:'bar',data:{labels:meses.map(m=>m.label),datasets:[{label:'Ventas aprobadas',data:meses.map(m=>ventasMes[m.key]||0),backgroundColor:'rgba(59,130,246,0.7)',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString()}}}}});
    // Chart vendedores
    if(topVends.length){const ctxV=document.getElementById('chart-vends');if(ctxV)new Chart(ctxV,{type:'bar',data:{labels:topVends.map(([v])=>v.substring(0,15)),datasets:[{label:'Ventas',data:topVends.map(([,n])=>n),backgroundColor:'rgba(16,185,129,0.7)',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString()}}}}});}
  },100);

  // Inventario alertas
  const bajo=allInv.filter(x=>(parseFloat(x.stock_actual)||0)<=(parseFloat(x.stock_minimo)||0));
  document.getElementById('dash-inv-kpi').innerHTML=bajo.length?`<table class="data"><thead><tr><th>Producto</th><th>Stock</th><th>Mín</th></tr></thead><tbody>${bajo.map(r=>`<tr><td>${esc(r.nombre)}</td><td class="stock-alert">${r.stock_actual}</td><td>${r.stock_minimo}</td></tr>`).join('')}</tbody></table>`:`<div class="empty" style="padding:20px;"><div class="icon">✅</div><div>Todo el inventario OK</div></div>`;
};

async function exportDashboardExcel(){
  const[cots,cont,pros,clis,inv]=await Promise.all([
    sb.from('cotizaciones').select('vendedor,total,estatus,fecha,cliente_nombre'),
    sb.from('contabilidad').select('tipo,monto,fecha,categoria'),
    sb.from('prospectos').select('etapa,valor_estimado,estatus'),
    sb.from('clientes').select('estatus,categoria_nombre'),
    sb.from('inventario').select('nombre,sku,stock_actual,stock_minimo')
  ]);
  const now=new Date();
  const meses=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);meses.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleString('es-MX',{month:'long',year:'numeric'})});}
  const aprobadas=(cots.data||[]).filter(c=>c.estatus==='aprobada');
  // KPIs generales
  const kpiData=[
    {KPI:'Total clientes',Valor:(clis.data||[]).length},
    {KPI:'Clientes activos',Valor:(clis.data||[]).filter(c=>c.estatus==='activo').length},
    {KPI:'Prospectos activos',Valor:(pros.data||[]).filter(p=>p.estatus!=='eliminado').length},
    {KPI:'Tasa de conversión %',Valor:pros.data?.length>0?Math.round((pros.data.filter(p=>p.etapa==='ganado').length/pros.data.filter(p=>p.estatus!=='eliminado').length)*100):0},
    {KPI:'Ventas aprobadas total',Valor:aprobadas.reduce((s,c)=>s+(parseFloat(c.total)||0),0)},
    {KPI:'Ticket promedio',Valor:aprobadas.length>0?aprobadas.reduce((s,c)=>s+(parseFloat(c.total)||0),0)/aprobadas.length:0},
    {KPI:'Ingresos totales',Valor:(cont.data||[]).filter(c=>c.tipo==='ingreso').reduce((s,c)=>s+(parseFloat(c.monto)||0),0)},
    {KPI:'Egresos totales',Valor:(cont.data||[]).filter(c=>c.tipo==='egreso').reduce((s,c)=>s+(parseFloat(c.monto)||0),0)},
    {KPI:'Cuentas por cobrar',Valor:(cont.data||[]).filter(c=>c.estatus==='pendiente de pago').reduce((s,c)=>s+(parseFloat(c.monto)||0),0)},
    {KPI:'Productos bajo stock mínimo',Valor:(inv.data||[]).filter(i=>(parseFloat(i.stock_actual)||0)<=(parseFloat(i.stock_minimo)||0)).length},
  ];
  // Ventas por mes
  const ventasMesData=meses.map(m=>{const tot=aprobadas.filter(c=>c.fecha?.startsWith(m.key)).reduce((s,c)=>s+(parseFloat(c.total)||0),0);return{Mes:m.label,'Ventas Aprobadas':tot,'N° Cotizaciones':aprobadas.filter(c=>c.fecha?.startsWith(m.key)).length};});
  // Ventas por vendedor
  const vMap={};aprobadas.forEach(c=>{const v=c.vendedor||'Sin asignar';vMap[v]=(vMap[v]||0)+(parseFloat(c.total)||0);});
  const vendData=Object.entries(vMap).sort((a,b)=>b[1]-a[1]).map(([v,t])=>({Vendedor:v,'Total Ventas':t}));
  // Embudo
  const etapas=['nuevo','contacto','propuesta','negociacion','ganado','perdido'];
  const prosActivos=(pros.data||[]).filter(p=>p.estatus!=='eliminado');
  const embudoData=etapas.map(e=>({Etapa:e,Cantidad:prosActivos.filter(p=>p.etapa===e).length,'%':prosActivos.length>0?Math.round(prosActivos.filter(p=>p.etapa===e).length/prosActivos.length*100):0}));
  exportMultiSheet([
    {name:'KPIs Generales',data:kpiData},
    {name:'Ventas por Mes',data:ventasMesData},
    {name:'Ventas por Vendedor',data:vendData},
    {name:'Embudo Conversión',data:embudoData},
  ],'PROINOR_KPIs_'+new Date().toISOString().split('T')[0]);
}

pages.clientes=async function(){const c=document.getElementById('content');c.innerHTML=`<div class="search-bar"><input type="text" id="cli-search" placeholder="Buscar cliente..." oninput="filterClientes()" /><select id="cli-cat-filter" onchange="filterClientes()" style="padding:8px;border:1px solid var(--border);border-radius:var(--radius);"><option value="">Todas las categorías</option>${_categorias.map(cat=>`<option value="${cat.id}">${cat.nombre}</option>`).join('')}</select><button class="btn btn-excel btn-sm" onclick="exportClientes()">📥 Excel</button><button class="btn btn-primary" onclick="modalCliente()">+ Nuevo cliente</button></div><div class="panel"><div class="panel-body tbl-wrap"><div id="cli-table">Cargando...</div></div></div>`;await loadClientes();};
let _clientes=[];
async function loadClientes(){const{data}=await sb.from('clientes').select('*').order('nombre');_clientes=data||[];renderClientes(_clientes);}
function filterClientes(){const q=(document.getElementById('cli-search')?.value||'').toLowerCase();const cat=document.getElementById('cli-cat-filter')?.value||'';renderClientes(_clientes.filter(c=>(c.nombre+c.empresa+c.email+(c.cliente_id||'')).toLowerCase().includes(q)&&(!cat||c.categoria_id===cat)));}
function renderClientes(list){const el=document.getElementById('cli-table');if(!el)return;if(!list.length){el.innerHTML=`<div class="empty"><div class="icon">👥</div><div>No hay clientes</div></div>`;return;}el.innerHTML=`<table class="data"><thead><tr><th>ID</th><th>Nombre</th><th>Empresa</th><th>RFC</th><th>Email</th><th>Ciudad</th><th>Categoría</th><th>Desc.</th><th>Estatus</th><th>Acciones</th></tr></thead><tbody>${list.map(r=>`<tr><td><span class="badge badge-blue">${r.cliente_id||'—'}</span></td><td><strong>${esc(r.nombre)}</strong></td><td>${esc(r.empresa||'—')}</td><td>${r.rfc||'—'}</td><td>${r.email||'—'}</td><td>${r.ciudad||'—'}</td><td>${r.categoria_nombre?`<span class="badge badge-purple">${r.categoria_nombre}</span>`:'—'}</td><td>${r.descuento_default||0}%</td><td>${badgeEstatus(r.estatus)}</td><td><button class="btn-icon" onclick="modalCliente('${r.id}')">✏️</button> <button class="btn-icon" onclick="editarCatCli('${r.id}','${esc(r.nombre)}')">🏷️</button> <button class="btn-icon" onclick="delCliente('${r.id}')">🗑️</button></td></tr>`).join('')}</tbody></table>`;}
async function modalCliente(id){let d={nombre:'',empresa:'',rfc:'',email:'',telefono:'',direccion:'',ciudad:'',estado:'',contacto:'',notas:'',estatus:'activo'};if(id){const{data}=await sb.from('clientes').select('*').eq('id',id).single();if(data)d=data;}openModal(id?'Editar cliente':'Nuevo cliente',`<div class="form-grid"><div class="form-group"><label>Nombre *</label><input id="f-nombre" value="${esc(d.nombre)}" /></div><div class="form-group"><label>Empresa</label><input id="f-empresa" value="${esc(d.empresa||'')}" /></div><div class="form-group"><label>RFC</label><input id="f-rfc" value="${esc(d.rfc||'')}" /></div><div class="form-group"><label>Email</label><input id="f-email" value="${esc(d.email||'')}" /></div><div class="form-group"><label>Teléfono</label><input id="f-tel" value="${esc(d.telefono||'')}" /></div><div class="form-group"><label>Contacto</label><input id="f-contacto" value="${esc(d.contacto||'')}" /></div><div class="form-group" style="grid-column:span 2"><label>Dirección</label><input id="f-dir" value="${esc(d.direccion||'')}" /></div><div class="form-group"><label>Ciudad</label><input id="f-ciudad" value="${esc(d.ciudad||'')}" /></div><div class="form-group"><label>Estado</label><input id="f-estado" value="${esc(d.estado||'')}" /></div><div class="form-group"><label>Estatus</label><select id="f-estatus"><option ${d.estatus==='activo'?'selected':''}>activo</option><option ${d.estatus==='inactivo'?'selected':''}>inactivo</option></select></div><div class="form-group" style="grid-column:span 2"><label>Notas</label><textarea id="f-notas">${esc(d.notas||'')}</textarea></div></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCliente('${id||''}')">Guardar</button>`);}
async function saveCliente(id){const obj={nombre:document.getElementById('f-nombre').value,empresa:document.getElementById('f-empresa').value,rfc:document.getElementById('f-rfc').value,email:document.getElementById('f-email').value,telefono:document.getElementById('f-tel').value,contacto:document.getElementById('f-contacto').value,direccion:document.getElementById('f-dir').value,ciudad:document.getElementById('f-ciudad').value,estado:document.getElementById('f-estado').value,estatus:document.getElementById('f-estatus').value,notas:document.getElementById('f-notas').value,updated_at:new Date().toISOString()};if(!obj.nombre){toast('Nombre requerido',false);return;}if(!id){const{data:last}=await sb.from('clientes').select('cliente_id').order('created_at',{ascending:false}).limit(1);let n=1;if(last?.length&&last[0].cliente_id){const m=last[0].cliente_id.match(/\d+/);if(m)n=parseInt(m[0])+1;}obj.cliente_id='CLI-'+String(n).padStart(4,'0');}const{error}=id?await sb.from('clientes').update(obj).eq('id',id):await sb.from('clientes').insert(obj);if(error){toast('Error: '+error.message,false);return;}toast('Cliente guardado ✓');closeModal();await loadClientes();}
function editarCatCli(id,nombre){adminGuard(()=>{const opts=_categorias.map(cat=>`<option value="${cat.id}" data-desc="${cat.descuento}">${cat.nombre} (${cat.descuento}% desc.)</option>`).join('');openModal('🏷️ Categoría — '+nombre,`<p style="font-size:13px;color:var(--muted);margin-bottom:16px;">El descuento se aplica automáticamente en cotizaciones.</p><div class="form-group" style="margin-bottom:12px;"><label>Categoría</label><select id="cat-sel" onchange="updCatDesc()">${'<option value="">— Sin categoría —</option>'+opts}</select></div><div id="cat-desc-info" style="font-size:13px;color:var(--muted);background:#f9fafb;padding:10px;border-radius:6px;display:none;"></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCatCli('${id}')">Guardar</button>`);});}
function updCatDesc(){const sel=document.getElementById('cat-sel');const opt=sel?.options[sel.selectedIndex];const info=document.getElementById('cat-desc-info');if(opt?.value&&info){info.style.display='block';info.textContent=`Descuento automático: ${opt.dataset.desc}%`;}else if(info)info.style.display='none';}
async function saveCatCli(id){const sel=document.getElementById('cat-sel');const opt=sel?.options[sel.selectedIndex];const catId=sel?.value||null;const catNom=catId?opt?.text?.split(' ')[0]||'':'';const desc=catId?parseFloat(opt?.dataset?.desc)||0:0;const{error}=await sb.from('clientes').update({categoria_id:catId,categoria_nombre:catNom,descuento_default:desc,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast('Error',false);return;}toast('Categoría actualizada ✓');closeModal();await loadClientes();}
async function delCliente(id){if(!confirm('¿Eliminar?'))return;await sb.from('clientes').delete().eq('id',id);toast('Eliminado');await loadClientes();}

function switchProspTab(tab,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(tab==='pipeline')loadProspPipeline();else if(tab==='lista')loadProspLista();else loadProspEliminados();}
async function loadProspPipeline(){const list=await loadProspData(false);const etapas=['nuevo','contacto','propuesta','negociacion','ganado','perdido'];const labels={nuevo:'Nuevo',contacto:'Contacto',propuesta:'Propuesta',negociacion:'Negociación',ganado:'Ganado',perdido:'Perdido'};const cols=etapas.map(e=>{const items=list.filter(p=>p.etapa===e);return `<div class="pipeline-col"><h4>${labels[e]} (${items.length})</h4>${items.map(p=>`<div class="pipeline-card" onclick="modalProspecto('${p.id}')"><div class="pname">${esc(p.nombre)}</div><div class="pco">${esc(p.empresa||'—')}</div><div class="pval">${fmt(p.valor_estimado||0)} · ${p.probabilidad||0}%</div></div>`).join('')}</div>`;}).join('');document.getElementById('prosp-content').innerHTML=`<div style="margin-bottom:12px;text-align:right;"><button class="btn btn-primary" onclick="modalProspecto()">+ Nuevo prospecto</button></div><div class="pipeline" style="grid-template-columns:repeat(6,1fr)">${cols}</div>`;}
async function loadProspLista(){const list=await loadProspData(false);document.getElementById('prosp-content').innerHTML=`<div style="margin-bottom:12px;text-align:right;"><button class="btn btn-primary" onclick="modalProspecto()">+ Nuevo prospecto</button></div><div class="panel"><div class="panel-body tbl-wrap">${list.length?`<table class="data"><thead><tr><th>Nombre</th><th>Empresa</th><th>Etapa</th><th>Vendedor</th><th>Valor est.</th><th>Prob.</th><th>Seguimiento</th><th>Acciones</th></tr></thead><tbody>${list.map(r=>`<tr><td><strong>${esc(r.nombre)}</strong></td><td>${esc(r.empresa||'—')}</td><td>${badgeEstatus(r.etapa)}</td><td>${r.vendedor||'—'}</td><td>${fmt(r.valor_estimado)}</td><td>${r.probabilidad||0}%</td><td>${fmtDate(r.fecha_seguimiento)}</td><td><button class="btn-icon" onclick="modalProspecto('${r.id}')">✏️</button> <button class="btn-icon" onclick="confirmarElimProsp('${r.id}','${esc(r.nombre)}')">🗑️</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><div class="icon">🎯</div><div>Sin prospectos</div></div>`}</div></div>`;}
async function loadProspEliminados(){const{data}=await sb.from('prospectos').select('*').eq('estatus','eliminado').order('updated_at',{ascending:false});const list=data||[];document.getElementById('prosp-content').innerHTML=`<div class="panel"><div class="panel-header"><h3>Eliminados</h3><span style="font-size:12px;color:var(--muted);">${list.length} registro(s)</span></div><div class="panel-body tbl-wrap">${list.length?`<table class="data"><thead><tr><th>Nombre</th><th>Empresa</th><th>Valor est.</th><th>Motivo</th><th>Fecha</th></tr></thead><tbody>${list.map(r=>`<tr><td><strong>${esc(r.nombre)}</strong></td><td>${esc(r.empresa||'—')}</td><td>${fmt(r.valor_estimado)}</td><td><span style="color:var(--danger);font-size:12px;">${esc(r.notas||'Sin motivo')}</span></td><td>${fmtDate(r.updated_at?.split('T')[0])}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><div>Sin eliminados</div></div>`}</div></div>`;}
function confirmarElimProsp(id,nombre){openModal('Eliminar prospecto',`<p style="margin-bottom:16px;color:var(--muted);">Eliminando <strong>${nombre}</strong>. Se conservará en historial.</p><div class="form-group"><label>Motivo *</label><textarea id="motivo-elim" style="min-height:80px;" placeholder="Motivo de eliminación..."></textarea></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="eliminarProsp('${id}')">Confirmar</button>`);}
async function eliminarProsp(id){const motivo=document.getElementById('motivo-elim')?.value?.trim();if(!motivo){toast('Debes ingresar el motivo',false);return;}await sb.from('prospectos').update({estatus:'eliminado',notas:motivo,updated_at:new Date().toISOString()}).eq('id',id);toast('Eliminado ✓');closeModal();pages.prospectos();}
async function modalProspecto(id){let d={nombre:'',empresa:'',email:'',telefono:'',origen:'',etapa:'nuevo',vendedor:'',valor_estimado:0,probabilidad:0,fecha_seguimiento:'',notas:''};if(id){const{data}=await sb.from('prospectos').select('*').eq('id',id).single();if(data)d=data;}const{data:vends}=await sb.from('vendedores').select('nombre').eq('activo',true);const vOpts=(vends||[]).map(v=>`<option ${d.vendedor===v.nombre?'selected':''}>${v.nombre}</option>`).join('');openModal(id?'Editar prospecto':'Nuevo prospecto',`<div class="form-grid"><div class="form-group"><label>Nombre *</label><input id="f-nombre" value="${esc(d.nombre)}" /></div><div class="form-group"><label>Empresa</label><input id="f-empresa" value="${esc(d.empresa||'')}" /></div><div class="form-group"><label>Email</label><input id="f-email" value="${esc(d.email||'')}" /></div><div class="form-group"><label>Teléfono</label><input id="f-tel" value="${esc(d.telefono||'')}" /></div><div class="form-group"><label>Origen</label><input id="f-origen" value="${esc(d.origen||'')}" /></div><div class="form-group"><label>Vendedor</label><select id="f-vend"><option value="">— —</option>${vOpts}</select></div><div class="form-group"><label>Etapa</label><select id="f-etapa"><option>nuevo</option><option ${d.etapa==='contacto'?'selected':''}>contacto</option><option ${d.etapa==='propuesta'?'selected':''}>propuesta</option><option ${d.etapa==='negociacion'?'selected':''}>negociacion</option><option ${d.etapa==='ganado'?'selected':''}>ganado</option><option ${d.etapa==='perdido'?'selected':''}>perdido</option></select></div><div class="form-group"><label>Probabilidad %</label><input type="number" id="f-prob" min="0" max="100" value="${d.probabilidad||0}" /></div><div class="form-group"><label>Valor estimado</label><input type="number" id="f-val" value="${d.valor_estimado||0}" /></div><div class="form-group"><label>Fecha seguimiento</label><input type="date" id="f-fseg" value="${d.fecha_seguimiento||''}" /></div><div class="form-group" style="grid-column:span 2"><label>Notas</label><textarea id="f-notas">${d.estatus==='eliminado'?'':esc(d.notas||'')}</textarea></div></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveProspecto('${id||''}')">Guardar</button>`);}
async function saveProspecto(id){const obj={nombre:document.getElementById('f-nombre').value,empresa:document.getElementById('f-empresa').value,email:document.getElementById('f-email').value,telefono:document.getElementById('f-tel').value,origen:document.getElementById('f-origen').value,vendedor:document.getElementById('f-vend').value,etapa:document.getElementById('f-etapa').value,probabilidad:parseInt(document.getElementById('f-prob').value)||0,valor_estimado:parseFloat(document.getElementById('f-val').value)||0,fecha_seguimiento:document.getElementById('f-fseg').value||null,notas:document.getElementById('f-notas').value,estatus:'activo',updated_at:new Date().toISOString()};if(!obj.nombre){toast('Nombre requerido',false);return;}const{error}=id?await sb.from('prospectos').update(obj).eq('id',id):await sb.from('prospectos').insert(obj);if(error){toast('Error: '+error.message,false);return;}toast('Guardado ✓');closeModal();pages.prospectos();}

  _cotItems=[];_cotNextId=1;
  let d={numero:'COT-'+String(Date.now()).slice(-4),cliente_id:null,cliente_nombre:'',vendedor:'',moneda:'MXN',descuento:0,iva:16,estatus:'borrador',validez:'30 días',fecha:new Date().toISOString().split('T')[0],notas:'',items:[],condiciones:{}};
  if(id){const{data}=await sb.from('cotizaciones').select('*').eq('id',id).single();if(data){d=data;_cotItems=(data.items||[]).map((it,i)=>({...it,id:i+1}));_cotNextId=_cotItems.length+1;}}

  ]);
  _matrizDescuentos=mzR.data||[];

  openModal(id?'Editar cotización':'Nueva cotización',`
  <div class="form-section-title">Datos generales</div>
  <div class="form-grid-3" style="margin-bottom:14px;">
    <div class="form-group"><label>N° Cotización</label><input id="cf-num" value="${esc(d.numero)}" /></div>

    <div class="form-group"><label>Vendedor</label><select id="cf-vend"><option value="">— —</option>${vOpts}</select></div>
    <div class="form-group"><label>Moneda</label><select id="cf-mon" onchange="calcCot()"><option>MXN</option><option ${d.moneda==='USD'?'selected':''}>USD</option><option ${d.moneda==='EUR'?'selected':''}>EUR</option></select></div>
    <div class="form-group"><label>Descuento % <span id="cf-cat-lbl" style="color:var(--accent);font-size:11px;"></span></label><input type="number" id="cf-desc" value="${d.descuento||0}" min="0" max="100" oninput="calcCot()" /></div>
    <div class="form-group"><label>IVA %</label><select id="cf-iva" onchange="calcCot()"><option value="0" ${d.iva==0?'selected':''}>0%</option><option value="8" ${d.iva==8?'selected':''}>8%</option><option value="16" ${(!d.iva||d.iva==16)?'selected':''}>16%</option></select></div>
    <div class="form-group"><label>Estatus</label><select id="cf-est"><option>borrador</option><option ${d.estatus==='enviada'?'selected':''}>enviada</option><option ${d.estatus==='aprobada'?'selected':''}>aprobada</option><option ${d.estatus==='rechazada'?'selected':''}>rechazada</option></select></div>
  </div>

  <div style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;">
    <select id="cf-prod-sel" style="flex:1;padding:7px;border:1px solid var(--border);border-radius:6px;font-size:13px;"><option value="">— Catálogo —</option>${prodOpts}</select>

    <button class="btn btn-secondary btn-sm" onclick="addCotItem()">+ Manual</button>
  </div>
  <table class="cot-items-table"><thead><tr><th>Descripción</th><th style="width:80px">Tipo</th><th style="width:60px">Cant.</th><th style="width:110px">Precio</th><th style="width:70px">Desc.%</th><th style="width:100px;text-align:right">Subtotal</th><th style="width:32px"></th></tr></thead><tbody id="cf-items"></tbody></table>
  <div class="cot-totals" style="margin-bottom:14px;"><div class="cot-tbox"><div class="cot-trow"><span style="color:var(--muted)">Subtotal bruto</span><span id="cf-tsub">$0.00</span></div><div class="cot-trow"><span style="color:var(--muted)">Desc. por categoría</span><span id="cf-tdesc-linea" style="color:var(--danger)">$0.00</span></div><div class="cot-trow"><span style="color:var(--muted)">Desc. adicional</span><span id="cf-tdesc" style="color:var(--danger)">-$0.00</span></div><div class="cot-trow"><span id="cf-ivalbl" style="color:var(--muted)">IVA</span><span id="cf-tiva">$0.00</span></div><div class="cot-trow grand"><span>Total</span><span id="cf-ttot">$0.00</span></div><div class="cot-letra" id="cf-letra"></div></div></div>

  <div class="form-grid" style="margin-bottom:12px;">
    <div class="form-group"><label>Otro método</label><input id="cf-otro-met" value="${esc(cond.otro_metodo||'')}" placeholder="Criptomonedas, etc." /></div>
    <div class="form-group"><label>Condición de pago</label><select id="cf-condpago"><option>Pago anticipado (100%)</option><option ${cond.condicion_pago==='50% anticipo, 50% entrega'?'selected':''}>50% anticipo, 50% entrega</option><option ${cond.condicion_pago==='30% anticipo, 70% entrega'?'selected':''}>30% anticipo, 70% entrega</option><option ${(!cond.condicion_pago||cond.condicion_pago==='Crédito 30 días')?'selected':''}>Crédito 30 días</option><option ${cond.condicion_pago==='Crédito 45 días'?'selected':''}>Crédito 45 días</option><option ${cond.condicion_pago==='Crédito 60 días'?'selected':''}>Crédito 60 días</option><option ${cond.condicion_pago==='Contra entrega'?'selected':''}>Contra entrega</option></select></div>

function onCotCliChange(){
  const sel=document.getElementById('cf-cli');const opt=sel?.options[sel.selectedIndex];
  if(opt?.value){
    const desc=parseFloat(opt.dataset.desc)||0;const cat=opt.dataset.cat||'';
    const catId=opt.dataset.catid||'';
    const descEl=document.getElementById('cf-desc');const catLbl=document.getElementById('cf-cat-lbl');
    if(descEl)descEl.value=desc;if(catLbl)catLbl.textContent=cat?`(Cat. ${cat})`:'';
    // Recalculate line discounts for all existing items when client changes
    _cotItems.forEach(it=>{
      if(it.catProdId&&catId){
        const entrada=_matrizDescuentos.find(m=>m.categoria_cliente_id===catId&&m.categoria_producto_id===it.catProdId);
        if(entrada){
          it.descLinea=parseFloat(entrada.descuento)||0;
          const inp=document.querySelector(`#cot-row-${it.id} input[type=number]:nth-of-type(2)`);
          // Update the discount input visually
          const subEl=document.getElementById('cot-sub-'+it.id);
          if(subEl)subEl.textContent=fmt(it.qty*it.price*(1-it.descLinea/100));
        }
      }
    });
    calcCot();
  }
}
function addCotFromCatalog(){
  const sel=document.getElementById('cf-prod-sel');const opt=sel?.options[sel.selectedIndex];
  if(!opt?.value){toast('Selecciona un producto',false);return;}
  const cliSel=document.getElementById('cf-cli');const cliOpt=cliSel?.options[cliSel?.selectedIndex];
  const catClienteId=cliOpt?.dataset?.catid||'';
  const catProdId=opt.dataset.catprod||'';
  let descPorLinea=0;
  if(catClienteId&&catProdId){
    const entrada=_matrizDescuentos.find(m=>m.categoria_cliente_id===catClienteId&&m.categoria_producto_id===catProdId);
    if(entrada)descPorLinea=parseFloat(entrada.descuento)||0;
  }
  addCotItem(opt.dataset.nombre+(opt.dataset.sku?' ['+opt.dataset.sku+']':''),'producto',1,parseFloat(opt.dataset.precio)||0,true,descPorLinea,opt.dataset.catprodnombre||'',catProdId);
  sel.selectedIndex=0;
}
function addCotItem(desc='',tipo='producto',qty=1,price=0,focus=true,descLinea=0,catProdNombre='',catProdId=''){
  const id=_cotNextId++;_cotItems.push({id,desc,tipo,qty,price,descLinea,catProdNombre,catProdId});
  const tbody=document.getElementById('cf-items');if(!tbody)return;

async function modalMovInv(invId,nombre,stockActual,tipo){openModal(`${tipo==='entrada'?'📥 Entrada':'📤 Salida'} — ${nombre}`,`<div style="background:#f9fafb;padding:12px;border-radius:8px;margin-bottom:16px;font-size:13px;"><b>Stock actual:</b> ${stockActual}</div><div class="form-grid"><div class="form-group"><label>Tipo</label><select id="mov-tipo"><option value="entrada" ${tipo==='entrada'?'selected':''}>Entrada</option><option value="salida" ${tipo==='salida'?'selected':''}>Salida</option><option value="ajuste">Ajuste (reemplaza stock)</option></select></div><div class="form-group"><label>Cantidad</label><input type="number" id="mov-cant" min="0.01" step="0.01" value="1" /></div><div class="form-group"><label>Referencia (OC, factura...)</label><input id="mov-ref" placeholder="Ej: OCP-0001" /></div><div class="form-group"><label>Responsable</label><input id="mov-user" placeholder="Nombre" /></div><div class="form-group" style="grid-column:span 2"><label>Motivo / Notas</label><textarea id="mov-motivo" style="min-height:60px;"></textarea></div></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveMovInv('${invId}',${stockActual})">Registrar</button>`);}

async function saveCategoria(id){
  const obj={nombre:document.getElementById('catd-nombre').value,descuento:parseFloat(document.getElementById('catd-desc').value)||0,descripcion:document.getElementById('catd-descr').value};
  if(!obj.nombre){toast('Nombre requerido',false);return;}
  let catId=id;
  if(!id){
    const{data:ins,error}=await sb.from('categorias_descuento').insert(obj).select().single();
    if(error){toast('Error: '+error.message,false);return;}
    catId=ins.id;
  }else{
    const{error}=await sb.from('categorias_descuento').update(obj).eq('id',id);
    if(error){toast('Error: '+error.message,false);return;}
  }
  if(_catsProd.length){
    const ops=_catsProd.map(async cp=>{
      const val=parseFloat(document.getElementById('mz-'+cp.id)?.value)||0;
      const{data:exist}=await sb.from('descuentos_matriz').select('id').eq('categoria_cliente_id',catId).eq('categoria_producto_id',cp.id).maybeSingle();
      if(exist?.id){return sb.from('descuentos_matriz').update({descuento:val,updated_at:new Date().toISOString()}).eq('id',exist.id);}
      else{return sb.from('descuentos_matriz').insert({categoria_cliente_id:catId,categoria_cliente_nombre:obj.nombre,categoria_producto_id:cp.id,categoria_producto_nombre:cp.nombre,descuento:val});}
    });
    await Promise.all(ops);
    const{data:matriz}=await sb.from('descuentos_matriz').select('*');
    _matrizDescuentos=matriz||[];
  }
  toast('Categoría guardada ✓');closeModal();loadCfgCats();
}

// ===================== EXCEL EXPORT UTILITIES =====================
function exportToExcel(data, sheetName, fileName){
  if(!data||!data.length){toast('Sin datos para exportar',false);return;}
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(data);
  // Auto column width
  const cols=Object.keys(data[0]).map(k=>({wch:Math.max(k.length,12)}));
  ws['!cols']=cols;
  XLSX.utils.book_append_sheet(wb,ws,sheetName);
  XLSX.writeFile(wb,fileName+'.xlsx');
  toast('Excel exportado ✓');
  logActivity('exportar',sheetName,'Exportó a Excel: '+fileName);
}

function exportMultiSheet(sheets, fileName){
  const wb=XLSX.utils.book_new();
  sheets.forEach(({data,name})=>{
    if(!data||!data.length)return;
    const ws=XLSX.utils.json_to_sheet(data);
    const cols=Object.keys(data[0]).map(k=>({wch:Math.max(k.length,14)}));
    ws['!cols']=cols;
    XLSX.utils.book_append_sheet(wb,ws,name);
  });
  XLSX.writeFile(wb,fileName+'.xlsx');
  toast('Excel exportado ✓');
}

function toggleAllPerms(val){document.querySelectorAll('.perm-check').forEach(c=>c.checked=val);}
async function savePermisos(id){
  const allCheck=document.getElementById('perm-all')?.checked;

  if(allCheck){perms={all:true};}
  else{document.querySelectorAll('.perm-check').forEach(c=>{if(c.checked)perms[c.dataset.mod]=true;});}
  await sb.from('usuarios').update({permisos:perms,updated_at:new Date().toISOString()}).eq('id',id);
  toast('Permisos guardados ✓');closeModal();

async function previewImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const data=new Uint8Array(ev.target.result);
    const wb=XLSX.read(data,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws);
    const prev=document.getElementById('import-preview');
    if(!rows.length){prev.innerHTML='<p style="color:var(--danger);font-size:13px;">Archivo vacío o formato incorrecto</p>';return;}
    window._importRows=rows;
    prev.innerHTML=`<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;font-size:13px;margin-bottom:12px;">✅ ${rows.length} registros encontrados. Columnas: ${Object.keys(rows[0]).join(', ')}</div><button class="btn btn-primary" onclick="confirmImport()">Importar ${rows.length} registros</button>`;
  };
  reader.readAsArrayBuffer(file);
}
async function confirmImport(){
  const rows=window._importRows||[];
  if(!rows.length){toast('Sin datos',false);return;}
  if(!confirm(`¿Importar ${rows.length} registros? Esto agregará datos nuevos sin borrar los existentes.`))return;
  const modulo=document.getElementById('import-modulo')?.value;
  const{error}=await sb.from(modulo).insert(rows);
  if(error){toast('Error al importar: '+error.message,false);return;}
  toast(`${rows.length} registros importados ✓`);
  logActivity('importar',modulo,`Importó ${rows.length} registros`);
}
